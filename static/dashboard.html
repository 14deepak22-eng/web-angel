  .verdict-box .row b{ color:var(--text); font-family:var(--font-mono); }

  .weight-total.ok{ background:var(--good-soft); color:var(--good); }
  .weight-total.bad{ background:var(--bad-soft); color:var(--bad); }

    position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:9px 16px;
    border-radius:6px; font-size:12.5px; z-index:60; transition:opacity .2s, transform .2s; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  @media (max-width:720px){
    .grid2, .grid3{ grid-template-columns:1fr; }
    table{ display:block; overflow-x:auto; }

</style>

<script>
(function(){

// ============================== SCORING ENGINE ==============================
function bqScore(f){
  const roceP = f.roce<8?0:f.roce<12?1:f.roce<18?2:f.roce<25?3:4;
  const roeP = f.roe<10?0:f.roe<15?1:f.roe<20?2:3;
  const marginP = f.marginChgBps>150?3:f.marginChgBps>0?2:f.marginChgBps>-100?1:0;
  const revConsP = (f.revCagr3>10 && f.revCagr5>10)?2:(f.revCagr3>0 && f.revCagr5>0)?1:0;
  const epsConsP = (f.epsCagr3>10 && f.epsCagr5>10)?2:(f.epsCagr3>0 && f.epsCagr5>0)?1:0;
  const cfoPat = f.pat?f.cfo/f.pat:0, fcfPat = f.pat?f.fcf/f.pat:0;
  const fcfGenP = (cfoPat>0.8 && fcfPat>0.6 && f.fcf>0)?3:(cfoPat>0.5 && f.fcf>0)?2:(f.fcf>0)?1:0;
  const debtQP = (f.de<0.5 && f.intCov>6)?2:(f.de<1 && f.intCov>3)?1:0;
  const promoQ = (f.promoterHold>=40 && f.promoterPledge===0)?1:(f.promoterHold>=40 && f.promoterPledge<5)?0.5:0;
  return round1((roceP+roeP+marginP+revConsP+epsConsP+fcfGenP+debtQP+promoQ)/20*100);
}
function growthScore(f){
  const revG = f.revCagr3<5?0:f.revCagr3<10?1:f.revCagr3<15?2:f.revCagr3<20?3:4;
  const epsG = f.epsCagr3<5?0:f.epsCagr3<12?1:f.epsCagr3<20?2:f.epsCagr3<30?3:4;
  const margExp = f.marginChgBps<0?0:f.marginChgBps<50?1:f.marginChgBps<150?2:f.marginChgBps<300?3:4;
  const qoqG = f.qoqRev<0?0:f.qoqRev<5?1:f.qoqRev<10?2:f.qoqRev<15?3:4;
  return round1((revG+epsG+margExp+qoqG)/16*100);
}
function balanceSheetScore(f){
  const deP = f.de<0.3?4:f.de<0.6?3:f.de<1?2:f.de<1.5?1:0;
  const icP = f.intCov>10?4:f.intCov>6?3:f.intCov>3?2:f.intCov>1.5?1:0;
  const crP = f.currentRatio>2?4:f.currentRatio>1.5?3:f.currentRatio>1.2?2:f.currentRatio>1?1:0;
  return round1((deP+icP+crP)/12*100);
}
function cashFlowScore(f){
  const cfoPat = f.pat?f.cfo/f.pat:0, fcfPat = f.pat?f.fcf/f.pat:0;
  const cfoP = cfoPat>1?4:cfoPat>0.8?3:cfoPat>0.5?2:cfoPat>0.2?1:0;
  const fcfP = fcfPat>0.8?4:fcfPat>0.5?3:fcfPat>0.2?2:fcfPat>0?1:0;
  return round1((cfoP+fcfP)/8*100);
}
function valuationScore(v){
  if(!v.pe || !v.medianPE || !v.sectorPE) return null;
  const histPrem = (v.pe/v.medianPE - 1) * 100;
  const secPrem = (v.pe/v.sectorPE - 1) * 100;
  const histP = histPrem<-20?4:histPrem<0?3:histPrem<20?2:histPrem<50?1:0;
  const secP = secPrem<-20?4:secPrem<0?3:secPrem<20?2:secPrem<50?1:0;
  const pegP = v.peg<1?4:v.peg<1.5?3:v.peg<2?2:v.peg<3?1:0;
  const fcfyP = v.fcfYield>6?4:v.fcfYield>4?3:v.fcfYield>2?2:v.fcfYield>0?1:0;
  return round1((histP+secP+pegP+fcfyP)/16*100);
}
function technicalSetupScore(t){
  const rsiP = (t.rsi>=45&&t.rsi<=65)?4:(t.rsi>65&&t.rsi<=75)?2:(t.rsi>=35&&t.rsi<45)?2:(t.rsi>75)?1:(t.rsi<35)?1:0;
  const macdP = t.macd>0?4:t.macd>-1?2:0;
  const adxP = t.adx>25?4:t.adx>20?3:t.adx>15?2:t.adx>10?1:0;
  const brkP = t.breakout?4:0;
  return round1((rsiP+macdP+adxP+brkP)/16*100);
}
function relStrength(t, nifty12){ return t.ret12m - nifty12; }
function momentumScore(t, nifty12){
  const rs12 = relStrength(t, nifty12);
  const ret12P = t.ret12m>40?4:t.ret12m>25?3:t.ret12m>10?2:t.ret12m>0?1:0;
  const ret6P = t.ret6m>25?4:t.ret6m>15?3:t.ret6m>5?2:t.ret6m>0?1:0;
  const maP = (t.cmp>t.dma20&&t.dma20>t.dma50&&t.dma50>t.dma100&&t.dma100>t.dma200)?4:
              (t.cmp>t.dma20&&t.cmp>t.dma200)?2:(t.cmp>t.dma200)?1:0;
  const rsP = rs12>25?4:rs12>15?3:rs12>5?2:rs12>0?1:0;
  return round1((ret12P+ret6P+maP+rsP)/16*100);
}
function relativeStrengthScore(t, nifty12){
  const rs12 = relStrength(t, nifty12);
  return rs12>30?100:rs12>20?85:rs12>10?70:rs12>0?55:rs12>-10?35:15;
}
function volumeScore(t){
  const ratio = t.avgVol?t.vol/t.avgVol:0;
  return ratio>2?100:ratio>1.5?80:ratio>1.2?60:ratio>1?40:20;
}
function volatilityRiskScore(t, r){
  const atrPct = t.cmp?t.atr/t.cmp*100:0;
  const atrP = atrPct<2?4:atrPct<3?3:atrPct<5?2:atrPct<7?1:0;
  const betaP = r.beta<0.8?4:r.beta<1?3:r.beta<1.3?2:r.beta<1.6?1:0;
  const ddP = r.dd3y>-15?4:r.dd3y>-25?3:r.dd3y>-40?2:r.dd3y>-55?1:0;
  const volScore = round1((atrP+betaP+ddP)/12*100);
  const liqScore = r.advt>50?100:r.advt>20?80:r.advt>10?60:r.advt>5?40:20;
  return round1((volScore+liqScore)/2);
}
function catalystScore(catalysts){
  const impactNum = {High:3, Medium:2, Low:1};
  const pricedFactor = {No:1, Partial:0.6, Yes:0.2};
  const subs = (catalysts||[]).filter(c=>c.desc && c.prob!==null && c.prob!=='').map(c =>
    Number(c.prob) * (impactNum[c.impact]/3) * pricedFactor[c.pricedIn]);
  if(subs.length===0) return null;
  return round1(subs.reduce((a,b)=>a+b,0)/subs.length);
}
function redFlagPenalty(f, flags){
  let pen = 0;
  if(f.promoterPledge>0) pen -= 10;
  if(f.pat && (f.cfo/f.pat)<0.5) pen -= 8;
  if(f.marginChgBps<-200) pen -= 7;
  if(flags.debtRising) pen -= 8;
  if(flags.acctIrreg) pen -= 15;
  if(flags.majorDilution) pen -= 8;
  if(flags.insiderSelling) pen -= 5;
  if(flags.relatedParty) pen -= 10;
  if(flags.govConcern) pen -= 15;
  return pen;
}
function classify(score, bands){
  if(score===null||score===undefined) return '-';
  for(let i=bands.length-1;i>=0;i--){ if(score>=bands[i][0]) return bands[i][1]; }
  return bands[0][1];
}
const CLASS_BANDS = [[0,'Avoid'],[60,'Weak'],[70,'Watchlist'],[80,'Strong'],[90,'Exceptional']];
const RR_BANDS = [[0,'Avoid'],[1.0,'Weak'],[1.5,'Acceptable'],[2.0,'Strong'],[3.0,'Exceptional']];
function round1(x){ return Math.round(x*10)/10; }
function classSlug(label){ return {Avoid:'avoid',Weak:'weak',Watchlist:'watchlist',Strong:'strong',Exceptional:'exceptional','-':'avoid'}[label] || 'avoid'; }

function computeAll(stock, config){
  const f=stock.fundamentals, v=stock.valuation, t=stock.technicals, r=stock.risk;
  const bq = bqScore(f), gr = growthScore(f), bs = balanceSheetScore(f), cf = cashFlowScore(f);
  const val = valuationScore(v);
  const ts = technicalSetupScore(t), mo = momentumScore(t, config.nifty12m), rs = relativeStrengthScore(t, config.nifty12m),
        vo = volumeScore(t), vr = volatilityRiskScore(t, r);
  const cat = catalystScore(stock.catalysts);
  const pen = redFlagPenalty(f, stock.flags);

  const nz = x => (x===null||x===undefined) ? 0 : x;
  const w = config.invWeights;
  const invRaw = nz(bq)*w.quality/100 + nz(gr)*w.growth/100 + nz(val)*w.valuation/100 +
                 nz(bs)*w.balanceSheet/100 + nz(cf)*w.cashFlow/100 + nz(cat)*w.catalyst/100 + nz(mo)*w.momentum/100;
  const invFinal = Math.max(0, invRaw + pen);

  const tw = config.tradeWeights;
  const tradeRaw = nz(mo)*tw.momentum/100 + nz(rs)*tw.relStrength/100 + nz(ts)*tw.techSetup/100 +
                    nz(vo)*tw.volume/100 + nz(cat)*tw.catalyst/100 + nz(vr)*tw.volRisk/100;
  const tradeFinal = Math.max(0, tradeRaw + pen);

  const h = stock.hypothesis;
  let expReturn=null, expDownside=null, rewardRisk=null;
  if(h && h.bullProb!=='' && h.baseProb!=='' && h.bearProb!==''){
    expReturn = round1((Number(h.bullProb)*Number(h.bullRet) + Number(h.baseProb)*Number(h.baseRet) + Number(h.bearProb)*Number(h.bearRet))/100);
    expDownside = Number(h.bearRet);
    if(expDownside<0) rewardRisk = round1(expReturn/Math.abs(expDownside));
  }

  const buyZoneLow = t.dma20 ? round1(t.dma20*0.98) : null;
  const buyZoneHigh = t.dma20 ? round1(t.dma20*1.02) : null;
  const stop = (t.cmp && t.atr) ? round1(t.cmp - 1.5*t.atr) : null;
  let posSize = null;
  if(stop!==null && t.cmp && (t.cmp-stop)>0){
    posSize = Math.floor((config.capital * config.riskPct/100) / (t.cmp - stop));
  }

  const invClass = classify(invFinal, CLASS_BANDS);
  const tradeClass = classify(tradeFinal, CLASS_BANDS);
  const rrClass = rewardRisk!==null ? classify(rewardRisk, RR_BANDS) : '-';

  let action = 'AVOID';
  if(h && h.status === 'Invalid'){ action = 'AVOID (Hypothesis Invalid)'; }
  else if(pen <= -15){ action = 'AVOID (Red Flags)'; }
  else if(invFinal>=80 && tradeFinal>=70 && rewardRisk!==null && rewardRisk>=2){ action = 'BUY'; }
  else if(invFinal>=80 && tradeFinal<70){ action = 'BUY ON PULLBACK'; }
  else if(invFinal>=70 && rewardRisk!==null && rewardRisk>=1.5){ action = 'WATCHLIST'; }
  else if(invFinal>=70){ action = 'WATCHLIST'; }

  return { bq, gr, bs, cf, val, ts, mo, rs, vo, vr, cat, pen,
           invRaw:round1(invRaw), invFinal:round1(invFinal), invClass,
           tradeRaw:round1(tradeRaw), tradeFinal:round1(tradeFinal), tradeClass,
           expReturn, expDownside, rewardRisk, rrClass,
           buyZoneLow, buyZoneHigh, stop, posSize, action };
}

// ============================== DEFAULT DATA ==============================
function defaultConfig(){

let STATE = { config: defaultConfig(), stocks: [] };
let UI = { openDrawerId:null, activeTab:'fundamentals', configOpen:false, sortKey:'invFinal', sortDir:-1, saving:false, refreshing:false };

async function apiGet(url){
  const res = await fetch(url, { credentials:'include' });
  if(res.status===401){ window.location.href='/login'; throw new Error('not authed'); }
  if(!res.ok) throw new Error('Request failed: '+res.status);
  return res.json();
}
async function apiPost(url, body){
  const res = await fetch(url, {
    method:'POST', credentials:'include',
    headers:{'Content-Type':'application/json'},
    body: body!==undefined ? JSON.stringify(body) : undefined,
  });
  if(res.status===401){ window.location.href='/login'; throw new Error('not authed'); }
  if(!res.ok) throw new Error('Request failed: '+res.status);
  return res.json();
}
async function apiDelete(url){
  const res = await fetch(url, { method:'DELETE', credentials:'include' });
  if(res.status===401){ window.location.href='/login'; throw new Error('not authed'); }
  if(!res.ok) throw new Error('Request failed: '+res.status);
  return res.json();
}

async function loadState(){
  try{
    const data = await apiGet('/api/state');
    STATE.config = { ...defaultConfig(), ...data.config };
    STATE.stocks = data.stocks.map(x => x.stock);
    STATE.refreshStatus = data.refreshStatus;
  }catch(e){ /* left with empty defaults; render() will show empty state */ }
  render();
}

// Debounced per-stock save: sends only the relevant field-group to the backend.
let saveTimers = {};
function saveStockGroup(ticker, group, payload){
  const key = ticker+':'+group;
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(async ()=>{
    try{ await apiPost('/api/stock/'+encodeURIComponent(ticker), {[group]: payload}); showToast('Saved'); }
    catch(e){ showToast('Could not save — check your connection'); }
  }, 400);
}
function saveStockMeta(ticker, meta){
  const key = ticker+':meta';
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(async ()=>{
    try{ await apiPost('/api/stock/'+encodeURIComponent(ticker), meta); showToast('Saved'); }
    catch(e){ showToast('Could not save — check your connection'); }
  }, 400);
}
let configSaveTimer=null;
function saveConfig(){
  clearTimeout(configSaveTimer);
  configSaveTimer = setTimeout(async ()=>{
    try{ await apiPost('/api/config', STATE.config); showToast('Saved'); }
    catch(e){ showToast('Could not save — check your connection'); }
  }, 400);
}
async function refreshAll(){
  if(UI.refreshing) return;
  UI.refreshing = true; render();
  showToast('Refreshing prices from Angel One...');
  try{
    const result = await apiPost('/api/refresh');
    if(result.error){ showToast('Refresh failed: '+result.error); }
    else{ showToast('Refreshed '+(result.updated||[]).length+' stocks'); }
  }catch(e){ showToast('Refresh failed'); }
  UI.refreshing = false;
  await loadState();
}
async function refreshOne(ticker){
  showToast('Refreshing '+ticker+'...');
  try{
    const result = await apiPost('/api/refresh/'+encodeURIComponent(ticker));
    if(result.error){ showToast('Refresh failed: '+result.error); }
    else{ showToast('Refreshed'); }
  }catch(e){ showToast('Refresh failed'); }
  await loadState();
  renderDrawer(); openDrawer();
}
async function fetchFundamentalsFor(ticker){
  showToast('Fetching fundamentals from Yahoo Finance...');
  try{
    const result = await apiPost('/api/fetch-fundamentals/'+encodeURIComponent(ticker));
    if(result.error){ showToast('Fetch failed: '+result.error); }
    else{
      showToast('Fetched what was available — check warnings in console');
      if(result.warnings && result.warnings.length) console.log('Fundamentals fetch warnings for '+ticker+':', result.warnings);
    }
  }catch(e){ showToast('Fetch failed'); }
  await loadState();
  renderDrawer(); openDrawer();
}
function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1600);
}

const root = document.getElementById('app-root');

function regimeLabel(cfg){
  if(cfg.niftyCmp>cfg.nifty200dma && cfg.nifty50dma>cfg.nifty200dma && cfg.vix<16) return {l:'BULL', c:'var(--good)'};
  if(cfg.vix>22) return {l:'HIGH VOLATILITY', c:'var(--bad)'};
  if(cfg.niftyCmp<cfg.nifty200dma) return {l:'BEAR', c:'var(--bad)'};
  return {l:'NEUTRAL', c:'var(--watch)'};
}

function fmtPct(x, d){ if(x===null||x===undefined||isNaN(x)) return '—'; return x.toFixed(d===undefined?1:d)+'%'; }
function fmtNum(x, d){ if(x===null||x===undefined||isNaN(x)) return '—'; return x.toFixed(d===undefined?1:d); }
function fmtCur(x){ if(x===null||x===undefined||isNaN(x)) return '—'; return '₹'+Math.round(x).toLocaleString('en-IN'); }

function actionClass(action){
  if(action==='BUY') return 'action-buy';
  if(action==='BUY ON PULLBACK') return 'action-pullback';
  if(action==='WATCHLIST') return 'action-watch';
  return 'action-avoid';
}

function render(){
  const cfg = STATE.config;
  const regime = regimeLabel(cfg);
  const computed = STATE.stocks.map(s => ({ stock:s, r: computeAll(s, cfg) }));

  const counts = {BUY:0,'BUY ON PULLBACK':0,WATCHLIST:0,AVOID:0};
  computed.forEach(c => {
    if(c.r.action.startsWith('AVOID')) counts.AVOID++;
    else counts[c.r.action] = (counts[c.r.action]||0)+1;
  });

  let sorted = [...computed];
  sorted.sort((a,b)=>{
    const get = (c)=> UI.sortKey==='ticker' ? c.stock.ticker : c.r[UI.sortKey];
    let av=get(a), bv=get(b);
    if(typeof av==='string') return UI.sortDir*av.localeCompare(bv);
    av = av===null||av===undefined?-999:av; bv = bv===null||bv===undefined?-999:bv;
    return UI.sortDir*(av-bv);
  });

  root.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <h1>NSE Stock Screener</h1>
        <span class="sub">Multi-module scoring, live in your browser</span>

        <span class="dot" style="background:${STATE.refreshStatus.lastError?'var(--bad)':'var(--good)'}"></span>
        Prices: ${new Date(STATE.refreshStatus.lastRunAt).toLocaleString('en-IN')}
      </div>` : ''}
      <button class="btn" id="btn-refresh" ${UI.refreshing?'disabled':''}>${UI.refreshing?'Refreshing…':'🔄 Refresh Now'}</button>

      <button class="btn btn-accent" id="btn-add">+ Add Stock</button>

    </div>

    <div class="main">
      <div class="summary-row">
        <div class="summary-card"><div class="n">${STATE.stocks.length}</div><div class="l">Stocks tracked</div></div>
        <div class="summary-card"><div class="n" style="color:var(--good)">${counts.BUY}</div><div class="l">Buy</div></div>
        <div class="summary-card"><div class="n" style="color:var(--watch)">${counts['BUY ON PULLBACK']}</div><div class="l">Buy on pullback</div></div>
        <div class="summary-card"><div class="n" style="color:var(--accent)">${counts.WATCHLIST}</div><div class="l">Watchlist</div></div>
        <div class="summary-card"><div class="n" style="color:var(--bad)">${counts.AVOID}</div><div class="l">Avoid</div></div>

      ${sorted.length===0 ? `

          </tr>
        </thead>
        <tbody>
          ${sorted.map(({stock,r}) => `

              <td><span class="score-pill score-${classSlug(r.tradeClass)}">${fmtNum(r.tradeFinal,0)}</span> <span style="color:var(--muted); font-size:11px;">${r.tradeClass}</span></td>

        </tbody>
      </table>
      `}

    tr.addEventListener('click', ()=>{ UI.openDrawerId = tr.dataset.id; UI.activeTab='fundamentals'; renderDrawer(); openDrawer(); });

          ${field('ROE % (3Y avg)','f','roe',f.roe)}
          ${field('EBITDA Margin %','f','ebitdaMargin',f.ebitdaMargin)}
          ${field('EBITDA Margin chg (bps YoY)','f','marginChgBps',f.marginChgBps)}
          ${field('Net Margin %','f','netMargin',f.netMargin)}
          ${field('Promoter Holding %','f','promoterHold',f.promoterHold)}
        </div>
        <div class="section-label">Growth</div>
        <div class="grid3">
          ${field('Revenue CAGR 3Y %','f','revCagr3',f.revCagr3)}
          ${field('Revenue CAGR 5Y %','f','revCagr5',f.revCagr5)}
          ${field('EPS CAGR 3Y %','f','epsCagr3',f.epsCagr3)}
          ${field('EPS CAGR 5Y %','f','epsCagr5',f.epsCagr5)}
          ${field('Latest QoQ Rev growth %','f','qoqRev',f.qoqRev)}
          ${field('Promoter Pledge %','f','promoterPledge',f.promoterPledge)}
        </div>
        <div class="section-label">Balance Sheet &amp; Cash Flow</div>
        <div class="grid3">
          ${field('Debt/Equity','f','de',f.de)}
          ${field('Interest Coverage','f','intCov',f.intCov)}
          ${field('Current Ratio','f','currentRatio',f.currentRatio)}
          ${field('CFO latest FY (₹Cr)','f','cfo',f.cfo)}
          ${field('PAT latest FY (₹Cr)','f','pat',f.pat)}
          ${field('FCF latest FY (₹Cr)','f','fcf',f.fcf)}
        </div>
      </div>

      <div class="tab-panel ${UI.activeTab==='valuation'?'active':''}" data-panel="valuation">
        <div class="grid3">
          ${field('CMP (₹)','v','cmp',v.cmp)}
          ${field('P/E (TTM)','v','pe',v.pe)}
          ${field('Forward P/E','v','fpe',v.fpe)}
          ${field('EV/EBITDA','v','evEbitda',v.evEbitda)}
          ${field('P/B','v','pb',v.pb)}
          ${field('PEG','v','peg',v.peg)}
          ${field('FCF Yield %','v','fcfYield',v.fcfYield)}
          ${field('Dividend Yield %','v','divYield',v.divYield)}
          ${field('Sector Avg P/E','v','sectorPE',v.sectorPE)}
          ${field('5Y Median P/E','v','medianPE',v.medianPE)}
          ${field('Fair Value Estimate (₹)','v','fairValue',v.fairValue)}
        </div>
      </div>

      <div class="tab-panel ${UI.activeTab==='technicals'?'active':''}" data-panel="technicals">
        <div class="section-label">Price &amp; Moving Averages</div>
        <div class="grid3">
          ${field('CMP (₹)','t','cmp',t.cmp)}
          ${field('20 DMA','t','dma20',t.dma20)}
          ${field('50 DMA','t','dma50',t.dma50)}
          ${field('100 DMA','t','dma100',t.dma100)}
          ${field('200 DMA','t','dma200',t.dma200)}
          ${field('52W High (₹)','t','high52',t.high52)}
        </div>
        <div class="section-label">Oscillators &amp; Volume</div>
        <div class="grid3">
          ${field('RSI (14)','t','rsi',t.rsi)}
          ${field('MACD (line-signal)','t','macd',t.macd)}
          ${field('ADX','t','adx',t.adx)}
          ${field('ATR (₹)','t','atr',t.atr)}
          ${field("Volume today ('000)",'t','vol',t.vol)}
          ${field("Avg Volume 20D ('000)",'t','avgVol',t.avgVol)}
        </div>
        <div class="section-label">Returns</div>
        <div class="grid3">
          ${field('1M Return %','t','ret1m',t.ret1m)}
          ${field('3M Return %','t','ret3m',t.ret3m)}
          ${field('6M Return %','t','ret6m',t.ret6m)}
          ${field('12M Return %','t','ret12m',t.ret12m)}
        </div>
        <div class="fgroup" style="max-width:200px;margin-top:6px;">
          <label>Breakout (last 3 days)?</label>
          <select data-group="t" data-key="breakout">
            <option value="true" ${t.breakout?'selected':''}>Yes</option>
            <option value="false" ${!t.breakout?'selected':''}>No</option>
          </select>
        </div>
      </div>

      <div class="tab-panel ${UI.activeTab==='risk'?'active':''}" data-panel="risk">
        <div class="grid3">
          ${field('Beta (3Y)','r','beta',rk.beta)}
          ${field('Historical Volatility % (ann.)','r','histVol',rk.histVol)}
          ${field('1Y Max Drawdown %','r','dd1y',rk.dd1y)}
          ${field('3Y Max Drawdown %','r','dd3y',rk.dd3y)}
          ${field('Current Drawdown from ATH %','r','currDD',rk.currDD)}
          ${field('Avg Daily Traded Value (₹Cr)','r','advt',rk.advt)}
        </div>
      </div>

      <div class="tab-panel ${UI.activeTab==='catalysts'?'active':''}" data-panel="catalysts">
        ${stock.catalysts.map((c,i)=>`
          <div class="catalyst-block">
            <div class="section-label" style="margin-top:0">Catalyst ${i+1}</div>
            <div class="fgroup" style="margin-bottom:10px;"><label>Description</label><textarea data-cat="${i}" data-key="desc">${escapeHtml(c.desc)}</textarea></div>
            <div class="grid3">
              <div class="fgroup"><label>Probability %</label><input type="number" data-cat="${i}" data-key="prob" value="${c.prob}"></div>
              <div class="fgroup"><label>Impact</label>
                <select data-cat="${i}" data-key="impact">
                  ${['High','Medium','Low'].map(o=>`<option ${c.impact===o?'selected':''}>${o}</option>`).join('')}
                </select>
              </div>
              <div class="fgroup"><label>Time (Qtrs)</label><input type="number" data-cat="${i}" data-key="time" value="${c.time}"></div>
            </div>
            <div class="fgroup" style="max-width:200px;margin-top:8px;"><label>Priced in?</label>
              <select data-cat="${i}" data-key="pricedIn">
                ${['No','Partial','Yes'].map(o=>`<option ${c.pricedIn===o?'selected':''}>${o}</option>`).join('')}
              </select>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="tab-panel ${UI.activeTab==='hypothesis'?'active':''}" data-panel="hypothesis">
        <div class="fgroup" style="margin-bottom:10px;"><label>Investment thesis — why this stock, why now</label>
          <textarea data-group="h" data-key="thesis" style="min-height:70px;">${escapeHtml(h.thesis)}</textarea></div>
        <div class="fgroup" style="max-width:220px;margin-bottom:10px;"><label>Time horizon</label>
          <select data-group="h" data-key="horizon">
            ${['Long Term','Positional','Swing','Tactical'].map(o=>`<option ${h.horizon===o?'selected':''}>${o}</option>`).join('')}
          </select>
        </div>
        <div class="section-label">Scenarios (probabilities should sum to 100%)</div>
        <div class="grid3">
          ${field('Bull Prob %','h','bullProb',h.bullProb)}
          ${field('Bull Return %','h','bullRet',h.bullRet)}
          ${field('Base Prob %','h','baseProb',h.baseProb)}
          ${field('Base Return %','h','baseRet',h.baseRet)}
          ${field('Bear Prob %','h','bearProb',h.bearProb)}
          ${field('Bear Return %','h','bearRet',h.bearRet)}
        </div>
        <div class="fgroup" style="margin:10px 0;"><label>Invalidation condition</label>
          <textarea data-group="h" data-key="invalidation">${escapeHtml(h.invalidation)}</textarea></div>
        <div class="grid2">
          <div class="fgroup"><label>Next review date</label><input type="date" data-group="h" data-key="reviewDate" value="${h.reviewDate||''}"></div>
          <div class="fgroup"><label>Status</label>
            <select data-group="h" data-key="status">
              ${['Valid','Under Review','Invalid'].map(o=>`<option ${h.status===o?'selected':''}>${o}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>

      <div class="tab-panel ${UI.activeTab==='flags'?'active':''}" data-panel="flags">
        <p style="color:var(--muted); font-size:12px; margin-bottom:10px;">These require judgement — pledge, cash-flow and margin flags are checked automatically from your Fundamentals inputs above.</p>
        ${flagRow('Debt rising rapidly (YoY)','debtRising',stock.flags.debtRising,-8)}
        ${flagRow('Accounting irregularity','acctIrreg',stock.flags.acctIrreg,-15)}
        ${flagRow('Major dilution (recent/planned)','majorDilution',stock.flags.majorDilution,-8)}
        ${flagRow('Insider selling','insiderSelling',stock.flags.insiderSelling,-5)}
        ${flagRow('Related-party issue','relatedParty',stock.flags.relatedParty,-10)}
        ${flagRow('Governance concern','govConcern',stock.flags.govConcern,-15)}
      </div>

      <button class="btn btn-danger" id="d-delete" style="margin-top:20px;width:100%;">Remove this stock</button>
    </div>
  `;

  function field(label, group, key, val){
    return `<div class="fgroup"><label>${label}</label><input type="number" step="any" data-group="${group}" data-key="${key}" value="${val===null||val===undefined?'':val}"></div>`;
  }
  function flagRow(label, key, checked, points){
    return `<div class="flag-row"><span>${label} <span style="color:var(--muted)">(${points})</span></span>
      <label class="toggle"><input type="checkbox" data-flag="${key}" ${checked?'checked':''}><span class="track"></span><span class="thumb"></span></label></div>`;
  }

  drawer.querySelector('#d-close').addEventListener('click', closeAllDrawers);
  drawer.querySelector('#d-sector').addEventListener('input', e=>{ stock.sector = e.target.value; saveStockMeta(stock.ticker, {sector: stock.sector}); });
  drawer.querySelector('#d-sector').addEventListener('blur', ()=>{ render(); renderDrawer(); openDrawer(); });
  drawer.querySelector('#d-refresh').addEventListener('click', ()=> refreshOne(stock.ticker));
  drawer.querySelector('#d-fetch-fund').addEventListener('click', ()=> fetchFundamentalsFor(stock.ticker));
  drawer.querySelector('#d-delete').addEventListener('click', async ()=>{
    try{ await apiDelete('/api/stock/'+encodeURIComponent(stock.ticker)); }catch(e){ showToast('Could not delete'); return; }
    STATE.stocks = STATE.stocks.filter(s=>s.ticker!==stock.ticker);
    UI.openDrawerId = null;
    render();
  });
  drawer.querySelectorAll('.tab').forEach(tabEl=>{
    tabEl.addEventListener('click', ()=>{ UI.activeTab = tabEl.dataset.tab; renderDrawer(); openDrawer(); });
  });
  const groupKeyMap = {f:'fundamentals', v:'valuation', t:'technicals', r:'risk', h:'hypothesis'};
  drawer.querySelectorAll('input[data-group], select[data-group], textarea[data-group]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const g = inp.dataset.group, k = inp.dataset.key;
      const target = {f, v, t, r:rk, h}[g];
      if(k==='breakout'){ target[k] = inp.value==='true'; }
      else if(inp.tagName==='TEXTAREA' || inp.type==='date' || ['horizon','status'].includes(k)){ target[k] = inp.value; }
      else { target[k] = inp.value===''? '' : fnum(inp.value); }
      render(); renderDrawer(); openDrawer();
      saveStockGroup(stock.ticker, groupKeyMap[g], target);
    });
  });
  drawer.querySelectorAll('[data-cat]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const i = Number(inp.dataset.cat), k = inp.dataset.key;
      if(inp.tagName==='TEXTAREA' || k==='impact' || k==='pricedIn'){ stock.catalysts[i][k] = inp.value; }
      else { stock.catalysts[i][k] = inp.value===''? '' : fnum(inp.value); }
      render(); renderDrawer(); openDrawer();
      saveStockGroup(stock.ticker, 'catalysts', stock.catalysts);
    });
  });
  drawer.querySelectorAll('[data-flag]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      stock.flags[inp.dataset.flag] = inp.checked;
      render(); renderDrawer(); openDrawer();
      saveStockGroup(stock.ticker, 'flags', stock.flags);
    });
  });
}

function renderSettingsDrawer(){
  const drawer = document.getElementById('settings-drawer');
  const cfg = STATE.config;
  const invTotal = Object.values(cfg.invWeights).reduce((a,b)=>a+Number(b),0);
  const tradeTotal = Object.values(cfg.tradeWeights).reduce((a,b)=>a+Number(b),0);
  const invLabels = {quality:'Business Quality',growth:'Fundamental Growth',valuation:'Valuation',balanceSheet:'Balance Sheet',cashFlow:'Cash Flow',catalyst:'Catalyst',momentum:'Momentum'};
  const tradeLabels = {momentum:'Momentum',relStrength:'Relative Strength',techSetup:'Technical Setup',volume:'Volume',catalyst:'Catalyst',volRisk:'Volatility/Risk'};

  drawer.innerHTML = `
    <div class="drawer-head"><h2>Market &amp; Weights</h2><button class="btn btn-ghost" id="s-close">✕</button></div>
    <div class="drawer-body">
      <div class="section-label" style="margin-top:0">Market Regime Inputs</div>
      <div class="grid2">
        ${sfield('Nifty 50 CMP','niftyCmp',cfg.niftyCmp)}
        ${sfield('Nifty 50 DMA','nifty50dma',cfg.nifty50dma)}
        ${sfield('Nifty 200 DMA','nifty200dma',cfg.nifty200dma)}
        ${sfield('India VIX','vix',cfg.vix)}
        ${sfield('Nifty 12M Return %','nifty12m',cfg.nifty12m)}
      </div>

      <div class="section-label">Capital &amp; Risk</div>
      <div class="grid2">
        ${sfield('Total Capital (₹)','capital',cfg.capital)}
        ${sfield('Max Risk per Position %','riskPct',cfg.riskPct)}
      </div>

      <div class="section-label">Investment Score Weights</div>
      ${Object.keys(cfg.invWeights).map(k=>weightRow('inv',k,invLabels[k],cfg.invWeights[k])).join('')}
      <div class="weight-total ${invTotal===100?'ok':'bad'}">Total: ${invTotal}% ${invTotal===100?'✓':'— should be 100%'}</div>

      <div class="section-label">Trading Score Weights</div>
      ${Object.keys(cfg.tradeWeights).map(k=>weightRow('trade',k,tradeLabels[k],cfg.tradeWeights[k])).join('')}
      <div class="weight-total ${tradeTotal===100?'ok':'bad'}">Total: ${tradeTotal}% ${tradeTotal===100?'✓':'— should be 100%'}</div>

      <button class="btn" id="s-reset" style="margin-top:20px;width:100%;">Reset to default weights</button>
    </div>
  `;

  function sfield(label,key,val){
    return `<div class="fgroup"><label>${label}</label><input type="number" step="any" data-cfg="${key}" value="${val}"></div>`;
  }
  function weightRow(group, key, label, val){
    return `<div class="weight-row">
      <div class="wlabel">${label}</div>
      <input type="range" min="0" max="50" value="${val}" data-wgroup="${group}" data-wkey="${key}">
      <div class="wval">${val}%</div>
    </div>`;
  }

  drawer.querySelector('#s-close').addEventListener('click', closeAllDrawers);
  drawer.querySelectorAll('[data-cfg]').forEach(inp=>{
    inp.addEventListener('change', ()=>{ cfg[inp.dataset.cfg] = fnum(inp.value); render(); renderSettingsDrawer(); openSettingsDrawer(); saveConfig(); });
  });
  drawer.querySelectorAll('[data-wgroup]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const g = inp.dataset.wgroup==='inv'?cfg.invWeights:cfg.tradeWeights;
      g[inp.dataset.wkey] = fnum(inp.value);
      renderSettingsDrawer(); openSettingsDrawer();
    });
    inp.addEventListener('change', ()=>{ render(); saveConfig(); });
  });
  drawer.querySelector('#s-reset').addEventListener('click', ()=>{
    const d = defaultConfig();
    cfg.invWeights = d.invWeights; cfg.tradeWeights = d.tradeWeights;
    render(); renderSettingsDrawer(); openSettingsDrawer(); saveConfig();
  });
}

loadState();
})();
</script>
